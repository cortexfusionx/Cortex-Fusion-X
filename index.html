<style>
:root{
  --bg:#030507;
  --panel:rgba(10,15,23,.82);
  --panel2:rgba(15,20,30,.72);
  --red:#ff163d;
  --red2:#ff003c;
  --cyan:#00eaff;
  --green:#00ff88;
  --text:#edf2f7;
  --muted:#8290a3;
  --line:rgba(0,234,255,.18);
  --glow:0 0 28px rgba(255,0,55,.20),0 0 50px rgba(0,234,255,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;min-height:100vh;
}
body:before{
  content:"";position:fixed;inset:0;z-index:-3;
  background:
    linear-gradient(rgba(255,22,61,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,234,255,.035) 1px,transparent 1px);
  background-size:52px 52px;
}
body:after{
  content:"";position:fixed;width:600px;height:600px;right:-220px;top:-240px;z-index:-2;
  background:radial-gradient(circle,rgba(255,0,55,.22),transparent 68%);
  filter:blur(30px);pointer-events:none;
}
#bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1;opacity:.18;pointer-events:none}

header{
  position:fixed;top:0;left:0;width:100%;z-index:1000;
  background:rgba(3,5,7,.72);backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(0,234,255,.18);
}
nav{
  max-width:1280px;height:76px;margin:auto;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
}

.logo {
  display: flex; align-items: center; gap: 10px; font-weight: 950;
  font-size: 22px; letter-spacing: 2px; text-decoration: none; color: #fff;
  transition: transform 0.3s ease; flex-shrink: 0;
}
.logo:hover { transform: scale(1.03); }
.logo-icon-wrap {
  width: 40px; height: 40px; border-radius: 50%; background: #000;
  border: 1.5px solid var(--red); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 15px rgba(255,22,61,0.6); overflow: hidden;
}
.logo-icon-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.logo-text {
  background: linear-gradient(90deg, #ffffff 0%, #b0c2de 50%, var(--cyan) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: 0 0 20px rgba(0,234,255,0.2);
}
.logo-x-badge {
  background: linear-gradient(135deg, var(--red2), #80001d); color: #fff; -webkit-text-fill-color: #fff;
  padding: 2px 9px; border-radius: 6px; font-size: 20px; font-weight: 950;
  border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 0 18px rgba(255,0,60,0.7);
  display: inline-block; animation: logoPulse 2.5s infinite alternate;
}
@keyframes logoPulse {
  0% { box-shadow: 0 0 12px rgba(255,0,60,0.5); }
  100% { box-shadow: 0 0 25px rgba(255,0,60,0.9), 0 0 10px var(--cyan); }
}

.nav-links{ display:flex; gap:27px; list-style:none; margin: 0 auto; align-items: center; }
.nav-links a{color:#b8c1cc;text-decoration:none;font-size:13px;letter-spacing:1px;transition:.25s}
.nav-links a:hover{color:var(--cyan);text-shadow:0 0 12px rgba(0,234,255,.5)}
.signin,.btn{
  border:1px solid var(--red);color:#fff;text-decoration:none;
  border-radius:7px;padding:11px 19px;background:rgba(255,0,55,.05);
  cursor:pointer;transition:.25s;font-weight:800;letter-spacing:.6px;
  display:inline-block; flex-shrink: 0;
}
.signin:hover,.primary:hover{background:var(--red);box-shadow:0 0 28px rgba(255,0,55,.45);transform:translateY(-2px)}

/* HEADER CART BADGE */
.header-cart-link {
  display: flex; align-items: center; gap: 6px; font: 800 12px monospace; color: var(--cyan);
  background: rgba(0,234,255,0.08); border: 1px solid rgba(0,234,255,0.3); padding: 6px 12px; border-radius: 20px;
  text-decoration: none; transition: 0.2s;
}
.header-cart-link:hover { background: var(--cyan); color: #000; box-shadow: 0 0 15px rgba(0,234,255,0.4); }
.cart-count-bubble { background: var(--red); color: #fff; padding: 1px 6px; border-radius: 10px; font-size: 10px; }

.founder-hero-badge {
  display: inline-flex; align-items: center; gap: 12px; margin: 22px 0; padding: 12px 28px;
  background: linear-gradient(135deg, rgba(0,234,255,0.12), rgba(255,0,60,0.12));
  border: 1.5px solid var(--cyan); border-radius: 50px;
  box-shadow: 0 0 30px rgba(0,234,255,0.25), inset 0 0 15px rgba(0,234,255,0.1);
  animation: founderGlow 3s infinite alternate;
}
@keyframes founderGlow {
  0% { border-color: var(--cyan); box-shadow: 0 0 25px rgba(0,234,255,0.3); }
  100% { border-color: var(--red); box-shadow: 0 0 35px rgba(255,0,60,0.5); }
}
.founder-hero-title { font: 900 13px monospace; letter-spacing: 2.5px; color: var(--muted); }
.founder-hero-name {
  font: 950 22px monospace; letter-spacing: 3px;
  background: linear-gradient(90deg, #ffffff, var(--cyan), #ffffff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: 0 0 20px rgba(0,234,255,0.5);
}

.hero{ min-height:100vh;padding:145px 22px 90px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative; }
.hero:before{
  content:"";position:absolute;width:520px;height:520px;border:1px solid rgba(0,234,255,.12);
  border-radius:50%;box-shadow:0 0 90px rgba(0,234,255,.08),inset 0 0 90px rgba(255,0,55,.06);
  animation:pulse 5s infinite ease-in-out;pointer-events:none;
}
.hero-content{max-width:980px;position:relative;z-index:1}
.tag{
  display:inline-block;border:1px solid rgba(0,234,255,.42);color:var(--cyan);
  padding:8px 15px;border-radius:30px;font:700 12px monospace;letter-spacing:2px;
  background:rgba(0,234,255,.045);box-shadow:0 0 20px rgba(0,234,255,.08);margin-bottom:24px
}
.hero h1{font-size:clamp(58px,10vw,125px);line-height:.86;font-weight:950;letter-spacing:-6px}
.hero h1 .red{color:var(--red);text-shadow:0 0 45px rgba(255,0,55,.35)}
.hero h1 .cyan{color:var(--cyan);text-shadow:0 0 45px rgba(0,234,255,.22)}
.hero p{max-width:700px;margin:30px auto;color:#9aa6b5;line-height:1.75;font-size:18px}
.buttons{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.primary{background:linear-gradient(135deg,#ff003c,#b8002e);border:none}
.secondary{border-color:rgba(0,234,255,.4);color:var(--cyan)}
.secondary:hover{background:rgba(0,234,255,.08);box-shadow:0 0 25px rgba(0,234,255,.18)}

section{padding:105px 6%;position:relative}
.section-title{text-align:center;margin-bottom:55px}
.section-title small{font:800 11px monospace;letter-spacing:3px;color:var(--cyan)}
.section-title h2{font-size:46px;margin-top:12px;letter-spacing:-1px}
.section-title p{color:var(--muted);margin-top:13px}

.products{max-width:1220px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;justify-content:center}
.card,.panel,.stat{
  background:linear-gradient(145deg,rgba(16,22,31,.88),rgba(5,8,12,.88));
  border:1px solid rgba(255,255,255,.07);border-radius:15px;box-shadow:var(--glow);
}
.card{overflow:hidden;transition:.35s}
.card:hover{transform:translateY(-9px) rotateX(1deg);border-color:rgba(255,22,61,.55)}
.product-image{
  height:205px;display:flex;align-items:center;justify-content:center;font-size:76px;
  background:
   radial-gradient(circle at center,rgba(255,0,55,.22),transparent 48%),
   radial-gradient(circle at 75% 25%,rgba(0,234,255,.12),transparent 35%),#06090d;
  position:relative;
}
.product-image:after{content:"";position:absolute;inset:15px;border:1px solid rgba(0,234,255,.10);border-radius:10px}
.card-content{padding:24px}
.card-content h3{font-size:21px;margin-bottom:10px}
.card-content p{color:#8793a2;line-height:1.65;margin-bottom:12px}

.card-link{color:var(--cyan);text-decoration:none;font-weight:800;font-size:13px;display:block;margin-top:12px;cursor:pointer}
.card-link:hover{color:#fff}

.stats{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.stat{text-align:center;padding:32px}
.stat h3{font-size:43px;color:var(--red);text-shadow:0 0 20px rgba(255,0,55,.25)}
.stat p{color:#748092;margin-top:8px}

.cta{max-width:1100px;margin:auto;padding:78px 25px;text-align:center;border:1px solid rgba(255,0,55,.32);border-radius:22px;background:radial-gradient(circle,rgba(255,0,55,.13),transparent 62%),#080a0e;box-shadow:0 0 70px rgba(255,0,55,.06)}
.cta h2{font-size:45px;margin-bottom:17px}
.cta p{color:#8995a4;max-width:650px;margin:0 auto 28px;line-height:1.7}

footer{padding:50px 6%;border-top:1px solid rgba(0,234,255,.12);background:#020304}
.footer-content{max-width:1220px;margin:auto;display:flex;justify-content:space-between;gap:25px;flex-wrap:wrap}
.footer-logo{font-size:24px;font-weight:950;letter-spacing:2px}.footer-logo span{color:var(--red)}
footer p{color:#5f6b79;margin-top:8px}
.footer-links{display:flex;gap:22px;flex-wrap:wrap}.footer-links a{color:#718092;text-decoration:none}.footer-links a:hover{color:var(--cyan)}

.toast{position:fixed;right:20px;bottom:20px;z-index:3000;background:#081018;border:1px solid var(--cyan);color:var(--cyan);padding:14px 18px;border-radius:7px;box-shadow:0 0 25px rgba(0,234,255,.18);font:700 13px monospace;display:none}

@keyframes pulse{50%{transform:scale(1.07);opacity:.65}}
@media(max-width:850px){
 .nav-links{display:none}
 .hero h1{letter-spacing:-3px}.hero:before{width:340px;height:340px}
 .stats{grid-template-columns:1fr}
 .section-title h2,.cta h2{font-size:35px}
}

.page{max-width:1200px;margin:auto;padding:145px 24px 90px}
.page h1{font-size:clamp(48px,8vw,88px);line-height:.9;margin:12px 0 24px}
.page h1 span{color:var(--red)}
.intro{max-width:760px;color:var(--muted);font-size:18px;line-height:1.7;margin-bottom:45px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.info{padding:30px;border:1px solid rgba(0,234,255,.2);border-radius:15px;background:linear-gradient(145deg,rgba(16,22,31,.88),rgba(5,8,12,.88));box-shadow:var(--glow)}
.info h2{color:var(--cyan);margin-bottom:12px}.info p{color:#8d99a7;line-height:1.7}

.contact-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin-top:20px}
.contact-card{padding:32px;border:1px solid rgba(0,234,255,.25);border-radius:18px;background:linear-gradient(145deg,rgba(16,22,31,.92),rgba(5,8,12,.92));box-shadow:0 0 30px rgba(0,234,255,.05);transition:.3s}
.contact-card:hover{border-color:var(--cyan);box-shadow:0 0 35px rgba(0,234,255,.18);transform:translateY(-5px)}
.contact-card-red:hover{border-color:var(--red);box-shadow:0 0 35px rgba(255,22,61,.22)}
.contact-icon{width:55px;height:55px;border-radius:12px;display:grid;place-items:center;font-size:26px;margin-bottom:20px;background:rgba(0,234,255,.08);border:1px solid rgba(0,234,255,.2);color:var(--cyan)}
.contact-icon-red{background:rgba(255,22,61,.08);border-color:rgba(255,22,61,.3);color:var(--red)}
.contact-card h3{font-size:22px;margin-bottom:8px}
.contact-card p{color:var(--muted);font-size:14px;margin-bottom:20px;line-height:1.6}
.contact-link-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:8px;font:800 13px monospace;text-decoration:none;transition:.25s}
.contact-btn-cyan{border:1px solid var(--cyan);color:var(--cyan);background:rgba(0,234,255,.05)}
.contact-btn-cyan:hover{background:var(--cyan);color:#000;box-shadow:0 0 20px rgba(0,234,255,.4)}
.contact-btn-red{border:1px solid var(--red);color:var(--red);background:rgba(255,22,61,.05)}
.contact-btn-red:hover{background:var(--red);color:#fff;box-shadow:0 0 20px rgba(255,22,61,.5)}
.phone-list{display:flex;flex-direction:column;gap:12px;margin-top:10px}

.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:120px 20px}
.auth-card{width:min(460px,100%);padding:38px;background:linear-gradient(145deg,rgba(16,22,31,.94),rgba(5,8,12,.94));border:1px solid rgba(255,22,61,.45);border-radius:18px;box-shadow:0 0 50px rgba(255,0,55,.12)}
.auth-card h1{font-size:38px;margin:10px 0}.auth-card h1 span{color:var(--red)}.auth-card p{color:var(--muted);line-height:1.6;margin-bottom:24px}
.auth-card input{width:100%;margin-bottom:14px;background:#020407;border:1px solid #263241;color:#fff;padding:12px;border-radius:6px;outline:none}
.auth-btn{width:100%;padding:13px;border:0;border-radius:6px;background:var(--red);color:#fff;font-weight:900;cursor:pointer}
.auth-msg{margin-top:15px;color:var(--green);font:12px monospace;display:none}

.auth-tabs{display:flex;gap:8px;margin-bottom:28px}.auth-tab{flex:1;padding:11px;border:1px solid #293441;background:#070b10;color:#7e8b9b;border-radius:5px;font-weight:900;cursor:pointer}.auth-tab.active{background:var(--red);color:#fff;border-color:var(--red)}
.password-wrap{display:flex;gap:6px;margin-bottom:14px}.password-wrap input{margin:0!important;flex:1}.show-pass{width:58px;border:1px solid #263241;background:#101820;color:var(--cyan);border-radius:6px;cursor:pointer;font:11px monospace;font-weight:900}
.auth-footer{display:flex;justify-content:space-between;gap:15px;margin-top:22px}.auth-footer a{color:var(--cyan);text-decoration:none;font-size:12px}
.social-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.social-links a{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid rgba(0,234,255,.16);border-radius:7px;color:#9aa8b7;text-decoration:none;font:800 11px monospace;letter-spacing:1px;transition:.2s;background:rgba(0,234,255,.02)}.social-links a:hover{color:#fff;border-color:var(--cyan);box-shadow:0 0 20px rgba(0,234,255,.12);transform:translateY(-2px)}

.profile-layout{display:grid;grid-template-columns:320px 1fr;gap:28px;max-width:1050px;margin:auto;}
.profile-card{
  padding:35px 22px;text-align:center;
  background:linear-gradient(145deg,rgba(16,22,31,.95),rgba(5,8,12,.95));
  border:1px solid rgba(0,234,255,.3);border-radius:22px;
  box-shadow:0 0 45px rgba(0,234,255,.12), inset 0 0 25px rgba(0,234,255,.03);
  position:relative;overflow:hidden;
}
.profile-card:before{
  content:"";position:absolute;top:-50px;left:-50px;width:120px;height:120px;
  background:radial-gradient(circle,rgba(0,234,255,.3),transparent 70%);
  pointer-events:none;
}
.profile-avatar-container{
  position:relative;width:170px;height:170px;margin:0 auto 22px;
  display:grid;place-items:center;
}
.profile-avatar-ring{
  position:absolute;inset:0;border-radius:50%;
  border:2px dashed var(--cyan);
  animation:ringSpin 18s linear infinite;
  box-shadow:0 0 20px rgba(0,234,255,.3);
}
@keyframes ringSpin{100%{transform:rotate(360deg)}}

.profile-photo{
  width:145px;height:145px;border-radius:50%;
  border:2px solid var(--red);display:grid;place-items:center;
  background:#071018;color:var(--cyan);font-size:42px;font-weight:900;
  overflow:hidden;box-shadow:0 0 25px rgba(255,22,61,.3);
  position:relative;z-index:2;
}
.profile-photo img{width:100%;height:100%;object-fit:cover}
.profile-upload{
  display:inline-block!important;width:auto!important;padding:9px 16px!important;
  font:800 11px monospace;letter-spacing:1px;background:rgba(0,234,255,.06);
  border:1px solid var(--cyan);color:var(--cyan);border-radius:20px;
  cursor:pointer;transition:.3s;box-shadow:0 0 15px rgba(0,234,255,.15);
}
.profile-upload:hover{background:var(--cyan);color:#000;box-shadow:0 0 25px rgba(0,234,255,.4)}

.cyber-badge-container{display:flex;flex-direction:column;gap:8px;margin-top:22px;}
.cyber-badge{
  font:800 10px monospace;letter-spacing:1.5px;padding:6px 12px;
  border-radius:6px;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);color:var(--muted);
}
.cyber-badge span{color:var(--green);}

.profile-form-panel{
  padding:35px;background:linear-gradient(145deg,rgba(16,22,31,.92),rgba(5,8,12,.92));
  border:1px solid rgba(255,22,61,.3);border-radius:22px;
  box-shadow:0 0 50px rgba(255,0,55,.1);
}
.profile-form-panel h2{
  font-size:24px;letter-spacing:2px;color:var(--cyan);
  margin-bottom:20px;font-family:monospace;display:flex;align-items:center;gap:10px;
}
.profile-field-group{margin-bottom:18px;}
.profile-field-group label{
  display:block;font:800 11px monospace;letter-spacing:1.5px;
  color:var(--muted);margin-bottom:8px;
}
.profile-field-group input{
  width:100%;background:#020509;border:1px solid rgba(0,234,255,.25);
  color:#fff;padding:13px 16px;border-radius:8px;outline:none;
  font:14px Arial,sans-serif;transition:.3s;
}
.profile-field-group input:focus{
  border-color:var(--cyan);box-shadow:0 0 18px rgba(0,234,255,.25);
}
.profile-btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:28px;}
.save-profile-btn{
  padding:13px;background:linear-gradient(135deg,#ff003c,#b8002e);
  border:none;color:#fff;font:900 12px monospace;letter-spacing:1px;
  border-radius:8px;cursor:pointer;transition:.3s;
  box-shadow:0 0 20px rgba(255,0,60,.3);
}
.save-profile-btn:hover{box-shadow:0 0 30px rgba(255,0,60,.6);transform:translateY(-2px)}
.logout-btn{
  padding:13px;border:1px solid var(--red);background:rgba(255,22,61,.05);
  color:var(--red);font:900 12px monospace;letter-spacing:1px;
  cursor:pointer;border-radius:8px;transition:.3s;
}
.logout-btn:hover{background:var(--red);color:#fff;box-shadow:0 0 25px rgba(255,22,61,.4)}

#welcome-preview{margin-top:14px;color:#fff;font-weight:900;font-size:20px;letter-spacing:1px}
.welcome-user{display:inline-block;padding:9px 14px;margin-bottom:22px;border:1px solid rgba(0,234,255,.35);border-radius:5px;color:var(--cyan);font:12px monospace;background:rgba(0,234,255,.04)}
@media(max-width:750px){.profile-layout{grid-template-columns:1fr}.auth-footer{flex-direction:column}}

.carealert-hero-card{
  max-width:1050px;margin:0 auto 25px;padding:55px 30px;text-align:center;
  background:
    radial-gradient(circle at 50% 35%,rgba(255,22,61,.18),transparent 42%),
    linear-gradient(145deg,rgba(16,22,31,.94),rgba(5,8,12,.96));
  border:1px solid rgba(255,22,61,.45);border-radius:22px;
  box-shadow:0 0 70px rgba(255,0,55,.10),inset 0 0 50px rgba(0,234,255,.025);
  position:relative;overflow:hidden;
}
.carealert-hero-card:before{
  content:"";position:absolute;inset:14px;border:1px solid rgba(0,234,255,.10);
  border-radius:15px;pointer-events:none;
}
.carealert-icon{font-size:70px;filter:drop-shadow(0 0 20px rgba(255,0,55,.45))}
.author-badge{
  display:inline-block;margin-top:15px;padding:8px 18px;border:1.5px solid var(--cyan);
  border-radius:25px;color:var(--cyan);font:900 12px monospace;letter-spacing:1.5px;
  background:rgba(0,234,255,.08);box-shadow:0 0 20px rgba(0,234,255,.2);
}
.carealert-hero-card h2{font-size:clamp(38px,7vw,72px);letter-spacing:4px;text-shadow:0 0 25px rgba(255,0,55,.18)}
.carealert-hero-card p{color:#8e9aaa;margin:12px 0 0}

.care-buttons{position:relative;z-index:2}
.care-grid{max-width:1050px;margin:auto}

let cart = JSON.parse(localStorage.getItem("cortexfusionx_cart") || "[]");

function saveCart() {
  localStorage.setItem("cortexfusionx_cart", JSON.stringify(cart));
  updateCartBadge();
}

function updateCartBadge() {
  const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
  const badge = document.getElementById("cart-count-bubble");
  if(badge) badge.textContent = totalItems;
}

function addToCart(name, basePrice) {
  const existing = cart.find(item => item.name === name);
  if(existing) {
    existing.quantity += 1;
  } else {
    cart.push({ name: name, basePrice: basePrice, quantity: 1 });
  }
  saveCart();
  toast(`ADDED "${name.toUpperCase()}" TO CART!`);
  if(location.hash === "#cart") route();
}

function updateQuantity(name, delta) {
  const item = cart.find(i => i.name === name);
  if(item) {
    item.quantity += delta;
    if(item.quantity <= 0) {
      cart = cart.filter(i => i.name !== name);
    }
  }
  saveCart();
  route();
}

function removeFromCart(name) {
  cart = cart.filter(i => i.name !== name);
  saveCart();
  toast(`REMOVED ITEM FROM CART`);
  route();
}

function handleContinueToPurchase() {
  if(cart.length === 0) {
    toast("YOUR CART IS EMPTY!");

}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}

function toast(msg){
  const t=document.getElementById("toast"); if(!t)return;
  t.textContent=msg;t.style.display="block";clearTimeout(window.__t);
  window.__t=setTimeout(()=>t.style.display="none",2500);
}

function route(){
  let p=location.hash.replace("#","")||"home";
  if(!pages[p])p="home";
  document.getElementById("app").innerHTML=pages[p];
  window.scrollTo(0,0);

  if(p==="home") {
    loadLiveProducts('home-products-container');
    const u=getUser();
    if(u&&u.loggedIn){
      const hero=document.querySelector(".hero-content");
      if(hero){
        const welcome=document.createElement("div");welcome.className="welcome-user";
        welcome.innerHTML="✓ AUTHENTICATED &nbsp; <strong>Welcome "+esc(u.username)+"</strong>";
        hero.prepend(welcome);
      }
    }

    const joinBtn = document.getElementById("join-cta-btn");
    if (joinBtn) {
      joinBtn.addEventListener("click", function(e) {
        const currentUser = getUser();
        if (currentUser && currentUser.loggedIn) {
          e.preventDefault();
          toast("You have already joined Cortex Fusion X");
          location.hash = "#profile";
        } else {
          e.preventDefault();
          location.hash = "#signin";
          setTimeout(() => {
            const signupTab = document.querySelector('.auth-tab[data-auth="signup"]');
            if (signupTab) signupTab.click();
          }, 50);
        }
      });
    }
  }
  if(p==="products") loadLiveProducts('all-products-container');
  if(p==="cart") loadCartPage();
  if(p==="signin") setupLogin();
  if(p==="profile") setupProfile();
}

window.addEventListener("hashchange",route);

function getUser(){
  return JSON.parse(localStorage.getItem("cortexfusionx_user")||"null");
}

function setupLogin(){
  const tabs=document.querySelectorAll(".auth-tab");
  tabs.forEach(tab=>tab.onclick=()=>{
    tabs.forEach(t=>t.classList.remove("active"));tab.classList.add("active");
    const login=tab.dataset.auth==="login";
    document.getElementById("login-box").style.display=login?"block":"none";
    document.getElementById("signup-box").style.display=login?"none":"block";
  });
  document.querySelectorAll(".show-pass").forEach(btn=>btn.onclick=()=>{
    const input=document.getElementById(btn.dataset.target);
    input.type=input.type==="password"?"text":"password";
    btn.textContent=input.type==="password"?"SHOW":"HIDE";
  });
  const login=document.getElementById("login");
  if(login)login.onsubmit=e=>{
    e.preventDefault();
    const id=document.getElementById("login-id").value.trim().toLowerCase();
    const pass=document.getElementById("login-password").value;
    const account=JSON.parse(localStorage.getItem("cortexfusionx_account")||"null");
    const msg=document.getElementById("login-msg");
    if(!account){msg.textContent="NO ACCOUNT FOUND // PLEASE SIGN UP FIRST";msg.style.display="block";return;}
    if((id===account.email.toLowerCase()||id===account.username.toLowerCase()) && pass===account.password){
      localStorage.setItem("cortexfusionx_user",JSON.stringify({...account,loggedIn:true}));
      msg.textContent="AUTHENTICATION SUCCESSFUL // WELCOME "+account.username;
      msg.style.display="block";
      setTimeout(()=>location.hash="#home",800);
    }else{
      msg.textContent="AUTHENTICATION FAILED // CHECK YOUR DETAILS";
      msg.style.display="block";
    }
  };
  const signup=document.getElementById("signup");
  if(signup)signup.onsubmit=e=>{
    e.preventDefault();
    const username=document.getElementById("signup-user").value.trim();
    const email=document.getElementById("signup-email").value.trim();
    const phone=document.getElementById("signup-phone").value.trim();
    const password=document.getElementById("signup-password").value;
    const confirm=document.getElementById("signup-confirm").value;
    const msg=document.getElementById("signup-msg");
    if(password!==confirm){msg.textContent="PASSWORDS DO NOT MATCH";msg.style.display="block";return;}
    const account={username,email,phone,password,photo:""};
    localStorage.setItem("cortexfusionx_account",JSON.stringify(account));
    localStorage.setItem("cortexfusionx_user",JSON.stringify({...account,loggedIn:true}));
    msg.textContent="ACCOUNT CREATED // WELCOME "+username;
    msg.style.display="block";
    setTimeout(()=>location.hash="#home",900);
  };
}

function setupProfile(){
  const account=JSON.parse(localStorage.getItem("cortexfusionx_account")||"null");
  const user=getUser();
  if(!account||!user||!user.loggedIn){
    toast("PLEASE LOG IN FIRST");
    location.hash="#signin";return;
  }
  const name=document.getElementById("profile-username"),email=document.getElementById("profile-email"),phone=document.getElementById("profile-phone"),preview=document.getElementById("profile-photo-preview"),welcome=document.getElementById("welcome-preview"),file=document.getElementById("profile-photo"),msg=document.getElementById("profile-msg");
  name.value=account.username||"";email.value=account.email||"";phone.value=account.phone||"";
  function show(){
    welcome.textContent="Welcome "+(name.value||"User");
    if(account.photo){preview.innerHTML=`<img src="${account.photo}" alt="Profile">`;}else preview.textContent=(name.value||"CFX").slice(0,3).toUpperCase();
  }
  show();
  file.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();reader.onload=ev=>{account.photo=ev.target.result;show()};reader.readAsDataURL(f);
  };
  document.getElementById("save-profile").onclick=()=>{
    account.username=name.value.trim()||account.username;
    account.email=email.value.trim()||account.email;
    account.phone=phone.value.trim();
    localStorage.setItem("cortexfusionx_account",JSON.stringify(account));
    localStorage.setItem("cortexfusionx_user",JSON.stringify({...account,loggedIn:true}));
    msg.textContent="PROFILE UPDATED // WELCOME "+account.username;
    msg.style.display="block";show();toast("PERSONALIZATION SAVED");
  };
  document.getElementById("logout").onclick=()=>{
    localStorage.setItem("cortexfusionx_user",JSON.stringify({...account,loggedIn:false}));
    toast("LOGGED OUT");setTimeout(()=>location.hash="#signin",500);
  };
}

function updateNav(){
  const a=document.getElementById("nav-auth"),u=getUser();
  if(!a)return;
  if(u&&u.loggedIn){a.href="#profile";a.dataset.page="profile";a.textContent="PROFILE";}else{a.href="#signin";a.dataset.page="signin";a.textContent="SIGN IN";}
  updateCartBadge();
}
window.addEventListener("hashchange",updateNav);
route();updateNav();
</script>

const canvas=document.getElementById("bg-canvas"),ctx=canvas.getContext("2d");let drops=[];
function resizeCanvas(){canvas.width=innerWidth;canvas.height=innerHeight;drops=Array(Math.ceil(canvas.width/14)).fill(1)}
resizeCanvas();addEventListener("resize",resizeCanvas);
const chars="01CORTEXFUSIONX<>[]{}ABCDEFGHIJKLMNOPQRSTUVWXYZ";
setInterval(()=>{ctx.fillStyle="rgba(3,5,7,.055)";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.font="14px monospace";ctx.fillStyle="#00eaff";drops.forEach((y,i)=>{ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*14,y*14);if(y*14>canvas.height&&Math.random()>.975)drops[i]=0;drops[i]++})},35);
